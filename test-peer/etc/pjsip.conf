; Two transports on the same port, so the bridge can be pointed at either
; without changing anything here. Bound to the loopback address: this peer
; is for tests on one machine and must not be reachable from a network.
[transport-udp]
type=transport
protocol=udp
bind=127.0.0.1:5060

[transport-tcp]
type=transport
protocol=tcp
bind=127.0.0.1:5060

; One account per line under test. Authentication is left at Asterisk's
; defaults on purpose - a standards-focused server challenges the way the
; RFC allows, not the way one particular gateway happens to.
[bridge-a]
type=endpoint
context=from-bridge
disallow=all
allow=g722
allow=ulaw
auth=bridge-a-auth
aors=bridge-a
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[bridge-a-auth]
type=auth
auth_type=userpass
username=bridge-a
password=test-peer-secret

[bridge-a]
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=30

; The strict counterpart to bridge-a. Deliberately without rewrite_contact,
; force_rport and rtp_symmetric: this endpoint takes the Contact header at
; its word and sends calls exactly where it says, transport parameter
; included. A client whose Contact does not describe a reachable address
; registers here and then never receives a call - which is what makes this
; endpoint worth having.
[bridge-b]
type=endpoint
context=from-bridge
disallow=all
allow=g722
allow=ulaw
auth=bridge-b-auth
aors=bridge-b
direct_media=no

[bridge-b-auth]
type=auth
auth_type=userpass
username=bridge-b
password=test-peer-secret

[bridge-b]
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=30
