[general]
static=yes
writeprotect=yes

; Everything a registered line can dial here. Each extension exists so a
; test can assert something without a person on the other end.
[from-bridge]
; Answers and sends back whatever it receives - the audio path in both
; directions, verifiable by comparing what went out with what came back.
exten => 100,1,Answer()
    same => n,Echo()
    same => n,Hangup()

; Answers and plays a fixed file: a deterministic audio source for checks
; that need known content rather than a reflection.
exten => 200,1,Answer()
    same => n,Playback(demo-congrats)
    same => n,Hangup()

; Rings for a while and then answers, to exercise the ringing state.
exten => 300,1,Ringing()
    same => n,Wait(5)
    same => n,Answer()
    same => n,Echo()
    same => n,Hangup()

; Never answers: for the outbound timeout and CANCEL path.
exten => 400,1,Ringing()
    same => n,Wait(600)
    same => n,Hangup()

; Rejects immediately, so the bridge's handling of a final non-2xx (and
; the ACK the RFC requires for it) can be observed.
exten => 500,1,Busy()

; Where a call originated towards a registered line lands when it comes
; back in - keeps "asterisk calls the bridge" self-contained.
exten => _X.,1,Answer()
    same => n,Echo()
    same => n,Hangup()
